name: Build IPA (Sideload / Free)

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID (例: com.yourname.remotehaptics)'
        required: false
        default: 'com.example.remotehaptics'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen (pinned)
        run: |
          VERSION=2.46.0
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          sudo /tmp/xcodegen-dist/xcodegen/install.sh /usr/local
          xcodegen --version

      - name: Set bundle ID
        run: |
          BUNDLE_ID="${{ github.event.inputs.bundle_id || 'com.example.remotehaptics' }}"
          sed -i '' "s|com.example.remotehaptics|${BUNDLE_ID}|g" project.yml
          echo "bundle id: ${BUNDLE_ID}"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, device slice)
        run: |
          xcodebuild \
            -project RemoteHaptics.xcodeproj \
            -scheme RemoteHaptics \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          APP=$(find build/derived/Build/Products/Release-iphoneos \
            -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi
          mkdir -p build/Payload
          cp -r "$APP" build/Payload/
          cd build
          zip -qr RemoteHaptics.ipa Payload/
          echo "IPA size: $(du -sh RemoteHaptics.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteHaptics-unsigned-${{ github.run_number }}
          path: build/RemoteHaptics.ipa
          retention-days: 30
