name: RemoteHaptics
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  RemoteHaptics:
    type: application
    platform: iOS
    sources:
      - RemoteHaptics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.remotehaptics
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
    info:
      path: RemoteHaptics/Info.plist
      properties:
        CFBundleDisplayName: RemoteHaptics
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: 同一ネットワーク上の RemoteHaptics サーバーを検索・接続するためにローカルネットワークを使用します。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  RemoteHaptics:
    build:
      targets:
        RemoteHaptics: all
    run:
      config: Debug
    archive:
      config: Release
